name: Capture YouTube live links
on:
  schedule:
    - cron: '15,25,45 3 * * 1-5'
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live stream
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 75 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/youtube-live"
